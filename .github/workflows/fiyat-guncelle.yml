name: THY fiyatlarını güncelle

on:
  workflow_dispatch:
    inputs:
      bolge:
        description: "Hangi bölge? (hepsi / Avrupa / Asya / Amerika)"
        default: "hepsi"
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: fiyat-guncelle
  cancel-in-progress: true

jobs:
  sorgula:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install "fast-flights==3.0.2" "typing_extensions>=4.12"
      - name: Fiyatları çek
        env:
          BOLGE: ${{ inputs.bolge }}
          FF_PROXY: ${{ secrets.FF_PROXY }}
        run: python scripts/fetch_prices.py
      - name: Sonuçları ve geçmişi commit'le
        if: always()
        run: |
          git config user.name "fiyat-radari-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/results.json docs/data/history.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Fiyat verisi güncellendi ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push

  yayinla:
    needs: sorgula
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
